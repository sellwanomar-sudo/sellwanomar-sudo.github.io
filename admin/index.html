<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Decap needs eval (form validation) and inline styles; everything else stays locked to GitHub and this site. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://api.github.com https://*.githubusercontent.com https://cms-auth.contentauthoritylab.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Content Manager | Content Authority Lab</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- decap-cms.js is pinned and copied in by the deploy workflow (see .github/workflows/deploy.yml) -->
  <script src="/admin/decap-cms.js"></script>
</body>
</html>
