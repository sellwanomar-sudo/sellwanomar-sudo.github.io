<div class="wrap page-hero">
  <p class="eyebrow">Let's work together</p>
  <h1>Have a project worth talking about?</h1>
</div>
<div class="wrap" style="padding-bottom:40px">
  <div class="contact">
    <div>
      <p>Tell us about your website, audience and goals. We'll get back to you within 1–2 business days with next steps.</p>
      <ul class="contact-links">
        <li><a href="mailto:team@contentauthoritylab.com">team@contentauthoritylab.com ↗</a></li>
        <li><a href="https://www.linkedin.com/in/selwanomar/" rel="noopener">LinkedIn ↗</a></li>
        <li><a href="https://clippings.me/selwan-omar" rel="noopener">Clippings.me portfolio ↗</a></li>
      </ul>
    </div>

    <!-- Contact form powered by Web3Forms (free). Paste your access key below. -->
    <form id="contact-form" novalidate>
      <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
      <input type="hidden" name="subject" value="New enquiry from your portfolio website">
      <input type="hidden" name="from_name" value="Portfolio website">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="row">
        <label>Your name<input type="text" name="name" required autocomplete="name" placeholder="Jane Doe"></label>
        <label>Email<input type="email" name="email" required autocomplete="email" placeholder="jane@company.com"></label>
      </div>
      <label>What do you need?
        <select name="service">
          <option>SEO content writing</option>
          <option>AEO &amp; GEO</option>
          <option>Content audit</option>
          <option>Technical content writing</option>
          <option>Website or product copy</option>
          <option>Social media content</option>
          <option>Something else</option>
        </select>
      </label>
      <label>Message<textarea name="message" required placeholder="A few lines about your project, website and timeline..."></textarea></label>
      <button class="btn light" type="submit">Send message →</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>
